version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /platform
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /platform
      - /web
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # pinned to 6.x until typescript-eslint supports TS 7
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
